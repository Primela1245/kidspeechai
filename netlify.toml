# 301 Redirect extensionless legal URLs to canonical .html so Google does not split impressions
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 301

[[redirects]]
  from = "/privacy/"
  to = "/privacy.html"
  status = 301

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 301

[[redirects]]
  from = "/terms/"
  to = "/terms.html"
  status = 301

[[redirects]]
  from = "/delete-account"
  to = "/delete-account.html"
  status = 301

[[redirects]]
  from = "/delete-account/"
  to = "/delete-account.html"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
